[params]
  description = "An independent publication on modern observability engineering. Trends, deep dives, how-tos, and open questions."
  tagline = "observability decoded"
  mission = "The stack is always changing. We help you see through it."
  # Brevo subscription form — paste the action URL from Contacts → Forms → your form → Share
  # e.g. "https://sibforms.com/serve/MUIEAK..."
  brevo_form_url = "https://a687b92f.sibforms.com/serve/MUIFAJDqIgx84az-BuoP8gEdihFM0YeuIs35pNsnqDxUA7D0oy8kTjObl3h-LXe0CWtvfLGxXFz99znudbnkHdoR3vQxEXBzUN_DwHOqR35NRPWyI4uHfssMvHoECDDNhDSpQx7QR1zMPB0KNpYMNX3uqGP9U0V5nfrhFVlDFHug-PICu_qzzzzRKL3_MuG5p96OKMiI5jdWM7dbvA=="

[params.analytics]
  umami_script = "https://cloud.umami.is/script.js"
  umami_website_id = "9b6c5846-f8af-408a-99ef-c03ada9b386d"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = false

[menu]
  [[menu.main]]
    name = "Articles"
    url = "/articles/"
    weight = 1
  [[menu.main]]
    name = "Guides"
    url = "/guides/"
    weight = 2
  [[menu.main]]
    name = "How-tos"
    url = "/howtos/"
    weight = 3
  [[menu.main]]
    name = "Q&A"
    url = "/qa/"
    weight = 4
  [[menu.main]]
    name = "Topics"
    url = "/tags/"
    weight = 5
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 6

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[pagination]
  pagerSize = 10

# Related content — drives "Related reading" at the end of articles (matched on shared tags).
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

baseURL = "https://scryops.dev/"
languageCode = "en-us"
title = "scryops — observability decoded"
theme = "scryops"

# Keep generated list titles as written: tag names must match the canonical
# casing in scripts/normalize-tags.py ("How-to", "OTLP"), not Hugo's title case.
capitalizeListTitles = false
[params]
  description = "An independent publication on modern observability engineering. Trends, deep dives, how-tos, and open questions."
  topics = ["logs", "metrics", "traces", "opentelemetry", "distributed-systems"]
  tagline = "observability decoded"
  mission = "The stack is always changing. We help you see through it."
  # Newsletter (Substack). Plain links only: no embed, no script, nothing
  # loads from Substack until the reader clicks. The subscribe block links to
  # "<newsletter_url>/subscribe"; leave empty to hide the block and footer link.
  newsletter_url = "https://scryops.substack.com"

[params.analytics]
  # Umami tracker is self-hosted (themes/scryops/assets/js/vendor/umami.js);
  # page-view events still go to Umami Cloud. Leave empty to drop analytics.
  umami_website_id = "9b6c5846-f8af-408a-99ef-c03ada9b386d"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[menu]
  [[menu.main]]
    name = "Articles"
    url = "/articles/"
    weight = 1
  [[menu.main]]
    name = "Guides"
    url = "/guides/"
    weight = 2
  [[menu.main]]
    name = "How-tos"
    url = "/howtos/"
    weight = 3
  [[menu.main]]
    name = "Q&A"
    url = "/qa/"
    weight = 4
  [[menu.main]]
    name = "Topics"
    url = "/tags/"
    weight = 5
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 6

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[pagination]
  pagerSize = 10

# Related content — drives "Related reading" at the end of articles (matched on shared tags).
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

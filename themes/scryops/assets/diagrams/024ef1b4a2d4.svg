<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 629.219px; background-color: transparent;" viewBox="-8 -8 629.21875 63" role="img" aria-roledescription="flowchart-v2"><style>#my-svg{font-family:'IBM Plex Mono',monospace;font-size:14px;fill:var(--nlab);}#my-svg .error-icon{fill:var(--surface);}#my-svg .error-text{fill:var(--nlab);stroke:var(--nlab);}#my-svg .edge-thickness-normal{stroke-width:2px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:var(--edge);stroke:var(--edge);}#my-svg .marker.cross{stroke:var(--edge);}#my-svg svg{font-family:'IBM Plex Mono',monospace;font-size:14px;}#my-svg .label{font-family:'IBM Plex Mono',monospace;color:var(--nlab);}#my-svg .cluster-label text{fill:var(--nlab);}#my-svg .cluster-label span,#my-svg p{color:var(--nlab);}#my-svg .label text,#my-svg span,#my-svg p{fill:var(--nlab);color:var(--nlab);}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1px;}#my-svg .flowchart-label text{text-anchor:middle;}#my-svg .node .katex path{fill:var(--nlab);stroke:var(--nlab);stroke-width:1px;}#my-svg .node .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .arrowheadPath{fill:var(--edge);}#my-svg .edgePath .path{stroke:var(--edge);stroke-width:2.0px;}#my-svg .flowchart-link{stroke:var(--edge);fill:none;}#my-svg .edgeLabel{background-color:var(--surface);text-align:center;}#my-svg .edgeLabel rect{opacity:0.5;background-color:var(--surface);fill:var(--surface);}#my-svg .labelBkg{background-color:var(--surface);}#my-svg .cluster rect{fill:var(--surface);stroke:var(--border);stroke-width:1px;}#my-svg .cluster text{fill:var(--nlab);}#my-svg .cluster span,#my-svg p{color:var(--nlab);}#my-s
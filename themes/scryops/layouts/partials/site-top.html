{{- /* layouts/partials/site-top.html
     Sticky chrome: pixel wordmark + reading-mode toggle. */ -}}
<header class="site-top">
  <a class="wordmark" href="/">scry<b>ops</b></a>
  <span class="pixel-tag">obs</span>
  <nav class="top-nav" aria-label="Primary">
    {{ range site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
  </nav>
  <span class="spacer"></span>
  {{ with .Type }}<span class="site-meta">{{ . | upper }}{{ with $.Params.readingTime }} · {{ . }} MIN{{ end }}</span>{{ end }}
  <div class="mode-toggle" role="group" aria-label="Reading mode">
    <button data-mode="light" aria-pressed="true">◐ Light</button>
    <button data-mode="dark"  aria-pressed="false">◑ Dark</button>
  </div>
</header>

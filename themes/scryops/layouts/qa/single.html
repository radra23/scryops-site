{{ define "main" }}
{{- /* Use the standard reading shell (no TOC) so Q&A inherits the prose
       measure + evidence breakout from .layout .article. */ -}}
<div class="layout">
  <article class="article">
    <div class="single-header">
      <div class="scry-artcard__meta">
        <span class="scry-tag qa">Q&amp;A</span>
        {{ range .Params.tags }}
        <a href="{{ "tags/" | relURL }}{{ . | urlize }}/" class="scry-tagpill">{{ . }}</a>
        {{ end }}
      </div>
      <h1>{{ .Title }}</h1>
      {{ with .Params.answer }}<div class="scry-artcard__excerpt">{{ . }}</div>{{ end }}
    </div>
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}

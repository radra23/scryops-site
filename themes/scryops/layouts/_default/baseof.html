  <script>
    /* ── Terminal collapse (persists via localStorage) ── */
    (function() {
      var terminal = document.querySelector('.terminal');
      if (!terminal) return;
      var toggle = document.querySelector('.terminal-toggle button');
      if (!toggle) return;
      var COLLAPSED = 'scryops_terminal_collapsed';
      function applyState(collapsed) {
        terminal.classList.toggle('collapsed', collapsed);
        toggle.textContent = collapsed ? '+ expand' : '− collapse';
        toggle.setAttribute('aria-expanded', !collapsed);
      }
      applyState(localStorage.getItem(COLLAPSED) === '1');
      toggle.addEventListener('click', function() {
        var next = !terminal.classList.contains('collapsed');
        localStorage.setItem(COLLAPSED, next ? '1' : '0');
        applyState(next);
      });
    })();

    /* ── Feed content-type filter ── */
    (function() {
      var btns = document.querySelectorAll('.filter-btn');
      if (!btns.length) return;
      btns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var type = btn.dataset.type;
          btns.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          document.querySelectorAll('.article').forEach(function(art) {
            if (type === 'all') { art.style.display = ''; return; }
            var tag = art.querySelector('.tag');
            var match = tag && tag.classList.contains(type);
            art.style.display = match ? '' : 'none';
          });
        });
      });
    })();

    /* ── TOC scroll-spy: highlight the section currently in view ── */
    (function() {
      var links = document.querySelectorAll('.toc #TableOfContents a[href^="#"]');
      if (!links.length || !('IntersectionObserver' in window)) return;
      var map = new Map();
      links.forEach(function(a) {
        var h = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
        if (h) map.set(h, a);
      });
      if (!map.size) return;
      var visible = new Set();
      function refresh() {
        if (!visible.size) return;            /* long section: keep the last active link */
        var top = null;
        visible.forEach(function(h) {
          if (!top || h.getBoundingClientRect().top < top.getBoundingClientRect().top) top = h;
        });
        links.forEach(function(a) { a.classList.remove('active'); a.removeAttribute('aria-current'); });
        var link = map.get(top);
        if (link) { link.classList.add('active'); link.setAttribute('aria-current', 'true'); }
      }
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) {
          if (e.isIntersecting) visible.add(e.target); else visible.delete(e.target);
        });
        refresh();
      }, { rootMargin: '-88px 0px -70% 0px', threshold: 0 });
      map.forEach(function(link, heading) { observer.observe(heading); });
    })();
  </script>

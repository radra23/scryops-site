<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  <!-- pixel chicken easter egg — wrapped in nav landmark so it's not orphaned outside a region -->
  <nav aria-label="Home shortcut">
  <a href="{{ "/" | relURL }}" class="pixel-chicken-link" aria-label="Back to home">
    <div class="chk-alert">!</div>
    <div class="chk-bubble">BWOCK!!</div>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 60" width="64" height="60"
         style="image-rendering:pixelated;image-rendering:crisp-edges;display:block;">

      <!-- ══ ZELDA CUCCO — 16×15 grid, 4px cells, 64×60 canvas ══ -->
      <!-- Colors: K=#111 outline, G=#9BAAB5 wing/back, W=#FFF breast/head,
                   R=#BB1111 comb, Y=#DDB800 beak+toes, Br=#7A4520 legs     -->

      <!-- R0 — Comb tips -->
      <rect x="32" y="0"  width="4"  height="4" fill="#111111"/>
      <rect x="36" y="0"  width="8"  height="4" fill="#BB1111"/>
      <rect x="44" y="0"  width="4"  height="4" fill="#111111"/>

      <!-- R1 — Comb base -->
      <rect x="28" y="4"  width="4"  height="4" fill="#111111"/>
      <rect x="32" y="4"  width="8"  height="4" fill="#BB1111"/>
      <rect x="40" y="4"  width="4"  height="4" fill="#111111"/>
      <rect x="44" y="4"  width="4"  height="4" fill="#9BAAB5"/>
      <rect x="48" y="4"  width="4"  height="4" fill="#111111"/>

      <!-- R2 — Body top outline + head top -->
      <rect x="8"  y="8"  width="28" height="4" fill="#111111"/>
      <rect x="36" y="8"  width="8"  height="4" fill="#9BAAB5"/>
      <rect x="44" y="8"  width="4"  height="4" fill="#111111"/>
      <rect x="48" y="8"  width="4"  height="4" fill="#FFFFFF"/>
      <rect x="52" y="8"  width="8"  height="4" fill="#111111"/>

      <!-- R3 — Eye row -->
      <rect x="4"  y="12" width="4"  height="4" fill="#111111"/>
      <rect x="8"  y="12" width="20" height="4" fill="#9BAAB5"/>
      <rect x="28" y="12" width="4"  height="4" fill="#111111"/>
      <rect x="32" y="12" width="12" height="4" fill="#9BAAB5"/>
      <rect x="44" y="12" width="4"  height="4" fill="#111111"/>
      <rect x="48" y="12" width="4"  height="4" fill="#FFFFFF"/>
      <rect x="52" y="12" width="4"  height="4" fill="#111111"/>

      <!-- R4 — Beak row -->
      <rect x="0"  y="16" width="4"  height="4" fill="#111111"/>
      <rect x="4"  y="16" width="24" height="4" fill="#9BAAB5"/>
      <rect x="28" y="16" width="4"  height="4" fill="#111111"/>
      <rect x="32" y="16" width="8"  height="4" fill="#9BAAB5"/>
      <rect x="40" y="16" width="4"  height="4" fill="#111111"/>
      <rect x="44" y="16" width="8"  height="4" fill="#FFFFFF"/>
      <rect x="52" y="16" width="4"  height="4" fill="#111111"/>
      <rect x="56" y="16" width="4"  height="4" fill="#DDB800"/>
      <rect x="60" y="16" width="4"  height="4" fill="#111111"/>

      <!-- R5 — Head bottom -->
      <rect x="0"  y="20" width="4"  height="4" fill="#111111"/>
      <rect x="4"  y="20" width="24" height="4" fill="#9BAAB5"/>
      <rect x="28" y="20" width="4"  height="4" fill="#111111"/>
      <rect x="32" y="20" width="8"  height="4" fill="#9BAAB5"/>
      <rect x="40" y="20" width="4"  height="4" fill="#111111"/>
      <rect x="44" y="20" width="8"  height="4" fill="#FFFFFF"/>
      <rect x="52" y="20" width="4"  height="4" fill="#111111"/>

      <!-- R6 — Body widens, white breast -->
      <rect x="0"  y="24" width="4"  height="4" fill="#111111"/>
      <rect x="4"  y="24" width="24" height="4" fill="#9BAAB5"/>
      <rect x="28" y="24" width="4"  height="4" fill="#111111"/>
      <rect x="32" y="24" width="16" height="4" fill="#FFFFFF"/>
      <rect x="48" y="24" width="4"  height="4" fill="#111111"/>

      <!-- R7 — Body, white narrows -->
      <rect x="0"  y="28" width="4"  height="4" fill="#111111"/>
      <rect x="4"  y="28" width="24" height="4" fill="#9BAAB5"/>
      <rect x="28" y="28" width="4"  height="4" fill="#111111"/>
      <rect x="32" y="28" width="12" height="4" fill="#FFFFFF"/>
      <rect x="44" y="28" width="4"  height="4" fill="#111111"/>

      <!-- R8 — Body narrows right -->
      <rect x="0"  y="32" width="4"  height="4" fill="#111111"/>
      <rect x="4"  y="32" width="20" height="4" fill="#9BAAB5"/>
      <rect x="24" y="32" width="4"  height="4" fill="#111111"/>
      <rect x="28" y="32" width="12" height="4" fill="#FFFFFF"/>
      <rect x="40" y="32" width="4"  height="4" fill="#111111"/>

      <!-- R9 — Lower body -->
      <rect x="0"  y="36" width="4"  height="4" fill="#111111"/>
      <rect x="4"  y="36" width="16" height="4" fill="#9BAAB5"/>
      <rect x="20" y="36" width="4"  height="4" fill="#111111"/>
      <rect x="24" y="36" width="4"  height="4" fill="#9BAAB5"/>
      <rect x="28" y="36" width="8"  height="4" fill="#FFFFFF"/>
      <rect x="36" y="36" width="4"  height="4" fill="#111111"/>

      <!-- R10 — Bottom body -->
      <rect x="4"  y="40" width="4"  height="4" fill="#111111"/>
      <rect x="8"  y="40" width="20" height="4" fill="#9BAAB5"/>
      <rect x="28" y="40" width="4"  height="4" fill="#111111"/>

      <!-- R11 — Body bottom outline -->
      <rect x="8"  y="44" width="20" height="4" fill="#111111"/>

      <!-- R12 — Brown legs -->
      <rect x="12" y="48" width="4"  height="4" fill="#111111"/>
      <rect x="16" y="48" width="4"  height="4" fill="#7A4520"/>
      <rect x="20" y="48" width="8"  height="4" fill="#111111"/>
      <rect x="28" y="48" width="4"  height="4" fill="#7A4520"/>
      <rect x="32" y="48" width="4"  height="4" fill="#111111"/>

      <!-- R13 — Inner toes -->
      <rect x="8"  y="52" width="4"  height="4" fill="#111111"/>
      <rect x="12" y="52" width="8"  height="4" fill="#DDB800"/>
      <rect x="20" y="52" width="8"  height="4" fill="#111111"/>
      <rect x="28" y="52" width="8"  height="4" fill="#DDB800"/>
      <rect x="36" y="52" width="4"  height="4" fill="#111111"/>

      <!-- R14 — Outer toe tips -->
      <rect x="4"  y="56" width="4"  height="4" fill="#111111"/>
      <rect x="8"  y="56" width="12" height="4" fill="#DDB800"/>
      <rect x="20" y="56" width="4"  height="4" fill="#111111"/>
      <rect x="24" y="56" width="4"  height="4" fill="#111111"/>
      <rect x="28" y="56" width="12" height="4" fill="#DDB800"/>
      <rect x="40" y="56" width="4"  height="4" fill="#111111"/>
    </svg>
  </a>
  </nav>
</body>
</html>

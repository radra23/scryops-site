<figure class="diagram">
  <div class="diag-card" style="padding:0.9rem 0.9rem 0.6rem;overflow:hidden;">
    <svg viewBox="0 0 760 274" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="lvm-title lvm-desc"
         style="width:100%;display:block;font-family:'Commit Mono','Courier New',monospace;">
      <title id="lvm-title">Metrics vs logs: the same incident from two vantage points</title>
      <desc id="lvm-desc">Left panel shows the metric view of an incident: error rate climbed from 0.8% to 4.2% between 14:20 and 14:35 UTC, but gateway, endpoint, customer segment, and root cause are all unknown. Right panel shows the log view of the same incident at 14:22 UTC: service payment-api, endpoint /checkout/confirm, gateway stripe, HTTP 422, error_type card_expired — a specific condition affecting only one customer segment, with no cascade.</desc>

      <rect width="760" height="274" fill="#161616"/>

      <!-- ── LEFT PANEL: METRIC VIEW ─────────────────────────────── -->
      <rect x="8" y="8" width="322" height="258" fill="#0D0D0D" rx="1"/>
      <!-- muted top stripe — intentionally less vibrant than the log panel -->
      <line x1="8" y1="8" x2="330" y2="8" stroke="#3A3A3A" stroke-width="2"/>

      <text x="169" y="27" fill="#808080" font-size="9" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.08em">METRIC VIEW</text>
      <line x1="16" y1="34" x2="322" y2="34" stroke="#2A2A2A" stroke-width="1"/>

      <!-- aggregate readout -->
      <text x="169" y="62" fill="#A8A8A0" font-size="10" text-anchor="middle">error_rate · 14:20–14:35 UTC</text>
      <text x="169" y="110" fill="#FF6060" font-size="42" text-anchor="middle" font-weight="bold">4.2%</text>
      <text x="169" y="130" fill="#A8A8A0" font-size="10" text-anchor="middle">↑ from 0.8%  ·  something is wrong</text>

      <!-- divider -->
      <line x1="16" y1="150" x2="322" y2="150" stroke="#2A2A2A" stroke-width="1"/>

      <!-- unknown fields -->
      <text x="169" y="170" fill="#555550" font-size="9" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.04em">WHAT YOU DON'T KNOW</text>

      <text x="148" y="193" fill="#6A6A62" font-size="10" text-anchor="end">gateway:</text>
      <text x="156" y="193" fill="#3A3A3A" font-size="10">???</text>

      <text x="148" y="211" fill="#6A6A62" font-size="10" text-anchor="end">endpoint:</text>
      <text x="156" y="211" fill="#3A3A3A" font-size="10">???</text>

      <text x="148" y="229" fill="#6A6A62" font-size="10" text-anchor="end">customer:</text>
      <text x="156" y="229" fill="#3A3A3A" font-size="10">???</text>

      <text x="148" y="247" fill="#6A6A62" font-size="10" text-anchor="end">reason:</text>
      <text x="156" y="247" fill="#3A3A3A" font-size="10">???</text>

      <!-- ── BRIDGE ──────────────────────────────────────────────── -->
      <text x="380" y="143" fill="#5B8DEF" font-size="22" text-anchor="middle">→</text>
      <text x="380" y="158" fill="#A8A8A0" font-size="9"  text-anchor="middle">same</text>
      <text x="380" y="170" fill="#A8A8A0" font-size="9"  text-anchor="middle">incident</text>

      <!-- ── RIGHT PANEL: LOG VIEW ───────────────────────────────── -->
      <rect x="430" y="8" width="322" height="258" fill="#0D0D0D" rx="1"/>
      <!-- green top stripe — signals "actionable" -->
      <line x1="430" y1="8" x2="752" y2="8" stroke="#1C7A2E" stroke-width="2"/>

      <text x="591" y="27" fill="#28CA41" font-size="9" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.08em">LOG VIEW</text>
      <line x1="438" y1="34" x2="744" y2="34" stroke="#1C7A2E" stroke-width="1" opacity="0.35"/>

      <!-- structured log fields: keys right-aligned at x=556, values at x=564 -->
      <text x="556" y="56"  fill="#808080" font-size="10" text-anchor="end">service:</text>
      <text x="564" y="56"  fill="#F0EEE8" font-size="10">payment-api</text>

      <text x="556" y="75"  fill="#808080" font-size="10" text-anchor="end">endpoint:</text>
      <text x="564" y="75"  fill="#F0EEE8" font-size="10">/checkout/confirm</text>

      <text x="556" y="94"  fill="#808080" font-size="10" text-anchor="end">gateway:</text>
      <text x="564" y="94"  fill="#F5A623" font-size="10">"stripe"</text>

      <text x="556" y="113" fill="#808080" font-size="10" text-anchor="end">http_status:</text>
      <text x="564" y="113" fill="#FF6060" font-size="10">422</text>

      <text x="556" y="132" fill="#808080" font-size="10" text-anchor="end">error_type:</text>
      <text x="564" y="132" fill="#FF6060" font-size="10">"card_expired"</text>

      <line x1="438" y1="148" x2="744" y2="148" stroke="#1C7A2E" stroke-width="1" opacity="0.3"/>

      <text x="556" y="167" fill="#808080" font-size="10" text-anchor="end">first_seen:</text>
      <text x="564" y="167" fill="#28CA41" font-size="10">14:22 UTC</text>

      <text x="556" y="186" fill="#808080" font-size="10" text-anchor="end">scope:</text>
      <text x="564" y="186" fill="#F0EEE8" font-size="10">stripe · expired cards only</text>

      <line x1="438" y1="202" x2="744" y2="202" stroke="#1C7A2E" stroke-width="1" opacity="0.3"/>

      <text x="591" y="223" fill="#28CA41" font-size="10" text-anchor="middle">specific condition — not a cascade</text>
      <text x="591" y="243" fill="#28CA41" font-size="10" text-anchor="middle">alert fires · zero false positives</text>
    </svg>
  </div>
  <figcaption>Fig. &mdash; The same incident at 14:22 UTC: the metric tells you something is wrong, the log tells you exactly what, where, and who.</figcaption>
</figure>

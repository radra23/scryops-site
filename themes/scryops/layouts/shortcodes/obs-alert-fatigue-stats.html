<style>

<figure class="af-fig"
  aria-label="Alert fatigue by the numbers. A typical enterprise sees roughly 2,000 alerts per week, of which only about 3 percent warrant immediate action. 67 percent of engineers admit ignoring or dismissing alerts without investigating. 44 percent of organizations had an outage caused by a suppressed or ignored alert. Actionable-alert rate: most teams sit below 30 percent today, a healthy range is 30 to 50 percent, and the bar this guide sets for trustworthy alerting is 70 percent or higher.">
  <div class="af-wrap">
    <div class="af-hdr">ALERT FATIGUE &nbsp;&middot;&nbsp; BY THE NUMBERS &nbsp;&middot;&nbsp; INDUSTRY DATA 2024&ndash;2026</div>

    <div class="af-grid">
      <div class="af-card" style="border-top-color:var(--cyan);">
        <div class="af-num" style="color:var(--cyan);">~2,000</div>
        <div class="af-desc">alerts per week at a typical enterprise</div>
      </div>
      <div class="af-card" style="border-top-color:var(--danger);">
        <div class="af-num" style="color:var(--danger);">3%</div>
        <div class="af-desc">of them genuinely need immediate action</div>
      </div>
      <div class="af-card" style="border-top-color:var(--warn);">
        <div class="af-num" style="color:var(--warn);">67%</div>
        <div class="af-desc">of engineers ignore or dismiss alerts without investigating</div>
      </div>
      <div class="af-card" style="border-top-color:var(--danger);">
        <div class="af-num" style="color:var(--danger);">44%</div>
        <div class="af-desc">had an outage caused by a suppressed or ignored alert</div>
      </div>
    </div>

    <div class="af-bars-hdr">ACTIONABLE-ALERT RATE &mdash; WHERE TEAMS ACTUALLY LAND</div>
    <div class="af-div"></div>

    <div class="af-row">
      <div class="af-lbl">Most teams today</div>
      <div class="af-track"><div class="af-bar" style="width:28%;background:color-mix(in srgb, var(--danger) 22%, transparent);border-right:2px solid var(--danger);"><span style="color:var(--danger);">&lt;30%</span></div></div>
    </div>
    <div class="af-row">
      <div class="af-lbl">Healthy range</div>
      <div class="af-track"><div class="af-bar" style="width:40%;background:color-mix(in srgb, var(--warn) 20%, transparent);border-right:2px solid var(--warn);"><span style="color:var(--warn);">30&ndash;50%</span></div></div>
    </div>
    <div class="af-row">
      <div class="af-lbl">Trustworthy &mdash; this guide&rsquo;s bar</div>
      <div class="af-track"><div class="af-bar" style="width:70%;background:color-mix(in srgb, var(--green) 18%, transparent);border-right:2px solid var(--green);"><span style="color:var(--green);">70%+</span></div></div>
    </div>
    <div class="af-axis"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>

    <div class="af-src">SOURCES: CATCHPOINT SRE REPORT &middot; INCIDENT.IO 2025 &middot; NEUBIRD STATE OF PRODUCTION RELIABILITY 2026<br>FIGURES ARE INDUSTRY-SURVEY MEDIANS &mdash; DIRECTIONAL, NOT ABSOLUTE</div>
  </div>
  <figcaption>Fig. &#8212; The gap between alert volume and alert value is the whole problem. When 97% of what fires is ignorable, people learn to ignore all of it &mdash; including the 3% that matters.</figcaption>
</figure>

<!-- layouts/shortcodes/obs-alert-fatigue-stats.html
     Two independent comparisons, both non-chromatic:
       stat cards  glyph diamond/square/triangle/square, ramp-3/1/2/1
                   (the two "danger" cards intentionally share a glyph+ramp —
                   that grouping is the point, same as before)
       rate bars   glyph square -> triangle -> disc, ramp-1 -> ramp-2 -> ramp-3
                   rail  3.5 solid -> 2.5 dashed -> 1.5 dotted (worst -> best)
     Previously cards used --cyan/--danger/--warn and bars used
     --danger/--warn/--green. Under html.pref-mono, --cyan/--danger/--eco-bright
     all resolve to --mc-ramp-1 and --green/--warn/--eco resolve to --mc-ramp-2,
     so the "most teams today" bar and the "healthy range" bar rendered
     IDENTICALLY — the guide's central distinction (healthy vs. trustworthy)
     disappeared. Ramp steps are now referenced directly. -->
<style>
.af-wrap{background:var(--fig-bg);border:1px solid var(--border);border-top:3px solid var(--mc-ink);padding:1.4rem 1.4rem 1.2rem;font-family:var(--font-code);}
.af-hdr{font-family:'Press Start 2P',monospace;font-size:.65rem;color:var(--mc-ink-muted);letter-spacing:.1em;text-align:center;margin-bottom:1.3rem;}
.af-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.6rem;}
@media(max-width:640px){.af-grid{grid-template-columns:repeat(2,1fr);}}
.af-card{background:var(--bg);border:1px solid var(--border);border-top:3px solid;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem;padding:1rem .8rem .85rem;}
.af-glyph{width:14px;height:14px;margin-bottom:.15rem;}
.af-num{font-size:2.3rem;font-weight:700;line-height:1;letter-spacing:-.02em;}
.af-desc{font-size:.78rem;color:var(--mc-ink-muted);line-height:1.5;flex:1;}
.af-bars-hdr{font-family:'Press Start 2P',monospace;font-size:0.625rem;color:var(--mc-ink-muted);letter-spacing:.08em;margin-bottom:.5rem;}
.af-div{height:1px;background:var(--border);margin-bottom:1rem;}
.af-row{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:.8rem;margin-bottom:.7rem;}
@media(max-width:640px){.af-row{grid-template-columns:110px 1fr;}}
.af-lbl{font-size:.8rem;color:var(--mc-ink-muted);text-align:right;line-height:1.35;}
@media(max-width:640px){.af-lbl{font-size:.68rem;}}
.af-track{background:var(--bg);border:1px solid var(--border);height:30px;position:relative;overflow:hidden;}
.af-bar{height:100%;display:flex;align-items:center;justify-content:flex-end;}
.af-bar span{font-size:.8rem;font-weight:700;padding-right:.5rem;}
.af-axis{display:flex;justify-content:space-between;margin-left:calc(190px + .8rem);font-size:.72rem;color:var(--mc-ink-muted);padding-top:.2rem;}
@media(max-width:640px){.af-axis{margin-left:calc(110px + .8rem);font-size:.64rem;}}
.af-src{margin-top:1.1rem;font-family:'Press Start 2P',monospace;font-size:0.625rem;line-height:1.7;color:var(--mc-ink-muted);letter-spacing:.03em;}
figure.af-fig{margin:2.5rem 0 2rem;}
figure.af-fig figcaption{font-size:.7rem;color:var(--mc-ink-muted);font-style:italic;margin-top:.6rem;padding-left:.2rem;}
</style>

<figure class="af-fig"
  aria-label="Alert fatigue by the numbers, each figure marked with a distinct shape rather than a colour. A typical enterprise sees roughly 2,000 alerts per week, marked with a diamond. 3 percent of them genuinely warrant immediate action, and 44 percent of organizations had an outage caused by a suppressed alert — both marked with a square, the same shared mark, since both are danger figures. 67 percent of engineers admit ignoring or dismissing alerts without investigating, marked with a triangle. Actionable-alert rate, ranked worst to best by an increasingly heavy, increasingly solid rail: most teams sit below 30 percent today, marked with a square on a thick solid rail. A healthy range is 30 to 50 percent, marked with a triangle on a medium dashed rail. The bar this guide sets for trustworthy alerting is 70 percent or higher, marked with a circle on a thin dotted rail.">
  <div class="af-wrap">
    <div class="af-hdr">ALERT FATIGUE &nbsp;&middot;&nbsp; BY THE NUMBERS &nbsp;&middot;&nbsp; INDUSTRY DATA 2024&ndash;2026</div>

    <div class="af-grid">
      <div class="af-card" style="border-top-color:var(--mc-ramp-3);">
        <svg class="af-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-3)" aria-hidden="true"><polygon points="7,0.5 13.5,7 7,13.5 0.5,7"/></svg>
        <div class="af-num" style="color:var(--mc-ramp-3);">~2,000</div>
        <div class="af-desc">alerts per week at a typical enterprise</div>
      </div>
      <div class="af-card" style="border-top-color:var(--mc-ramp-1);">
        <svg class="af-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-1)" aria-hidden="true"><rect x="1" y="1" width="12" height="12"/></svg>
        <div class="af-num" style="color:var(--mc-ramp-1);">3%</div>
        <div class="af-desc">of them genuinely need immediate action</div>
      </div>
      <div class="af-card" style="border-top-color:var(--mc-ramp-2);">
        <svg class="af-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-2)" aria-hidden="true"><polygon points="7,0.8 13.5,13.2 0.5,13.2"/></svg>
        <div class="af-num" style="color:var(--mc-ramp-2);">67%</div>
        <div class="af-desc">of engineers ignore or dismiss alerts without investigating</div>
      </div>
      <div class="af-card" style="border-top-color:var(--mc-ramp-1);">
        <svg class="af-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-1)" aria-hidden="true"><rect x="1" y="1" width="12" height="12"/></svg>
        <div class="af-num" style="color:var(--mc-ramp-1);">44%</div>
        <div class="af-desc">had an outage caused by a suppressed or ignored alert</div>
      </div>
    </div>

    <div class="af-bars-hdr">ACTIONABLE-ALERT RATE &mdash; WHERE TEAMS ACTUALLY LAND</div>
    <div class="af-div"></div>

    <div class="af-row">
      <div class="af-lbl"><svg width="10" height="10" viewBox="0 0 10 10" fill="var(--mc-ramp-1)" aria-hidden="true" style="vertical-align:-1px;margin-right:.35rem;"><rect width="10" height="10"/></svg>Most teams today</div>
      <div class="af-track"><div class="af-bar" style="width:28%;background:color-mix(in srgb, var(--mc-ramp-1) 12%, transparent);border-right:3.5px solid var(--mc-ramp-1);"><span style="color:var(--mc-ramp-1);">&lt;30%</span></div></div>
    </div>
    <div class="af-row">
      <div class="af-lbl"><svg width="10" height="10" viewBox="0 0 10 10" fill="var(--mc-ramp-2)" aria-hidden="true" style="vertical-align:-1px;margin-right:.35rem;"><polygon points="5,0.5 9.6,9.3 0.4,9.3"/></svg>Healthy range</div>
      <div class="af-track"><div class="af-bar" style="width:40%;background:color-mix(in srgb, var(--mc-ramp-2) 10%, transparent);border-right:2.5px dashed var(--mc-ramp-2);"><span style="color:var(--mc-ramp-2);">30&ndash;50%</span></div></div>
    </div>
    <div class="af-row">
      <div class="af-lbl"><svg width="10" height="10" viewBox="0 0 10 10" fill="var(--mc-ramp-3)" aria-hidden="true" style="vertical-align:-1px;margin-right:.35rem;"><circle cx="5" cy="5" r="4.3"/></svg>Trustworthy &mdash; this guide&rsquo;s bar</div>
      <div class="af-track"><div class="af-bar" style="width:70%;background:color-mix(in srgb, var(--mc-ramp-3) 9%, transparent);border-right:1.5px dotted var(--mc-ramp-3);"><span style="color:var(--mc-ramp-3);">70%+</span></div></div>
    </div>
    <div class="af-axis"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>

    <div class="af-src">SOURCES: CATCHPOINT SRE REPORT &middot; INCIDENT.IO 2025 &middot; NEUBIRD STATE OF PRODUCTION RELIABILITY 2026<br>FIGURES ARE INDUSTRY-SURVEY MEDIANS &mdash; DIRECTIONAL, NOT ABSOLUTE</div>
  </div>
  <figcaption>Fig. &#8212; The gap between alert volume and alert value is the whole problem. When 97% of what fires is ignorable, people learn to ignore all of it &mdash; including the 3% that matters.</figcaption>
</figure>

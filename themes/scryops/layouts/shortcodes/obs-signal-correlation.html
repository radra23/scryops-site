<figure class="diagram">
  <div class="diag-card" style="padding:1.2rem 1rem;">
    <svg viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="corr-title corr-desc"
         style="width:100%;display:block;font-family:var(--font-code);">
      <title id="corr-title">Signal correlation: Observability 1.0 vs 2.0</title>
      <desc id="corr-desc">Left panel shows Observability 1.0 with three isolated data sources — logs, metrics, and traces — each in separate silos with no connection between them. Right panel shows Observability 2.0 where the same three sources feed into a correlation engine, which produces a predicted risk score output.</desc>

      <rect width="720" height="180" fill="#161616"/>

      <!-- Left panel: Siloed (1.0) -->
      <rect x="8" y="8" width="272" height="164" fill="#111" rx="1"/>
      <rect x="8" y="8" width="272" height="2" fill="#3A3A3A"/>
      <!-- Header: muted gray — intentionally less vibrant than 2.0, but meets 4.5:1 AA -->
      <text x="144" y="24" fill="#808080" font-size="10" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.08em">OBSERVABILITY 1.0 — SILOED</text>

      <!-- Signal boxes: neutral gray — readable (4.9:1) while clearly less vibrant than the colored 2.0 panel -->
      <rect x="84" y="34" width="120" height="26" fill="#0D0D0D" stroke="#3A3A3A" stroke-width="1"/>
      <text x="144" y="51" fill="#808080" font-size="10" text-anchor="middle">LOGS</text>

      <rect x="84" y="77" width="120" height="26" fill="#0D0D0D" stroke="#3A3A3A" stroke-width="1"/>
      <text x="144" y="94" fill="#808080" font-size="10" text-anchor="middle">METRICS</text>

      <rect x="84" y="120" width="120" height="26" fill="#0D0D0D" stroke="#3A3A3A" stroke-width="1"/>
      <text x="144" y="137" fill="#808080" font-size="10" text-anchor="middle">TRACES</text>

      <!-- Isolation annotations -->
      <text x="144" y="73"  fill="#808080" font-size="10" text-anchor="middle" font-style="italic">// isolated</text>
      <text x="144" y="116" fill="#808080" font-size="10" text-anchor="middle" font-style="italic">// isolated</text>

      <!-- Center arrow — visible, matches correlation theme -->
      <text x="313" y="97"  fill="#5B8DEF" font-size="28" text-anchor="middle">→</text>
      <text x="313" y="113" fill="#5B8DEF" font-size="10"   text-anchor="middle">correlate</text>

      <!-- Right panel: Unified (2.0) -->
      <rect x="342" y="8" width="370" height="164" fill="#111" rx="1"/>
      <rect x="342" y="8" width="370" height="2" fill="#5B8DEF" opacity="0.6"/>
      <text x="527" y="24" fill="#5B8DEF" font-size="10" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.08em">OBSERVABILITY 2.0 — UNIFIED</text>

      <!-- Signal boxes: coloured, active -->
      <rect x="350" y="34" width="90" height="26" fill="#0D0D0D" stroke="#3A6FAF" stroke-width="1"/>
      <text x="395" y="51" fill="#5B8DEF" font-size="10" text-anchor="middle">LOGS</text>

      <rect x="350" y="77" width="90" height="26" fill="#0D0D0D" stroke="#D4820A" stroke-width="1"/>
      <text x="395" y="94" fill="#F5A623" font-size="10" text-anchor="middle">METRICS</text>

      <rect x="350" y="120" width="90" height="26" fill="#0D0D0D" stroke="#5A3FAF" stroke-width="1"/>
      <text x="395" y="137" fill="#A89FFF" font-size="10" text-anchor="middle">TRACES</text>

      <!-- Converging paths — increased stroke, higher opacity -->
      <path d="M 440,47 C 462,47 462,76 480,76"    fill="none" stroke="#5B8DEF" stroke-width="2" opacity="0.8"/>
      <path d="M 440,90 L 480,90"                   fill="none" stroke="#F5A623" stroke-width="2" opacity="0.8"/>
      <path d="M 440,133 C 462,133 462,104 480,104" fill="none" stroke="#A89FFF" stroke-width="2" opacity="0.8"/>

      <!-- Correlation engine -->
      <rect x="480" y="65" width="130" height="50" fill="rgba(0,47,167,0.14)" stroke="#4A6FBF" stroke-width="1.5" rx="1"/>
      <text x="545" y="86"  fill="#5B8DEF" font-size="10" text-anchor="middle">CORRELATION</text>
      <text x="545" y="100" fill="#5B8DEF" font-size="10" text-anchor="middle">ENGINE</text>

      <!-- Output arrow + box -->
      <path d="M 610,90 L 630,90" fill="none" stroke="#28CA41" stroke-width="2"/>
      <polygon points="630,86 640,90 630,94" fill="#28CA41"/>
      <rect x="643" y="68" width="62" height="44" fill="rgba(40,202,65,0.10)" stroke="#1C7A2E" stroke-width="1.5" rx="1"/>
      <text x="674" y="86"  fill="#28CA41" font-size="10" text-anchor="middle">PREDICTED</text>
      <text x="674" y="98"  fill="#28CA41" font-size="10" text-anchor="middle">RISK</text>
      <text x="674" y="110" fill="#28CA41" font-size="10" text-anchor="middle">SCORE</text>
    </svg>
  </div>
  <figcaption>Fig. 3 — Siloed signals give you three partial pictures. A unified model sees the connections between them.</figcaption>
</figure>

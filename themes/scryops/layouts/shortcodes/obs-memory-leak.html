<figure class="diagram">
  <div class="diag-card" style="padding:1.2rem 1rem 0.8rem;">
    <svg viewBox="0 0 680 352" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="mem-title mem-desc"
         style="width:100%;display:block;font-family:'Commit Mono','Courier New',monospace;">
      <title id="mem-title">Memory leak p99 latency progression over 12 hours</title>
      <desc id="mem-desc">Line chart showing p99 latency rising from 70ms at hour 0 to 745ms at hour 12. At hour 4, a predictive flag is raised (green marker). At hour 10, the 500ms alert threshold is breached (red marker). The predictive model provides a 6-hour early warning window. Customer impact begins around hour 8.</desc>

      <rect width="680" height="330" fill="#161616"/>

      <!-- Customer impact zone — more visible -->
      <rect x="437" y="60" width="188" height="170" fill="rgba(255,68,68,0.10)"/>

      <!-- Grid: horizontal — slightly more visible -->
      <line x1="70" y1="230" x2="625" y2="230" stroke="#2A2A2A" stroke-width="1"/>
      <line x1="70" y1="192" x2="625" y2="192" stroke="#2A2A2A" stroke-width="0.5" stroke-dasharray="3,5"/>
      <line x1="70" y1="117" x2="625" y2="117" stroke="#2A2A2A" stroke-width="0.5" stroke-dasharray="3,5"/>
      <line x1="70" y1="60"  x2="625" y2="60"  stroke="#2A2A2A" stroke-width="0.5" stroke-dasharray="3,5"/>
      <line x1="70" y1="60"  x2="70"  y2="230" stroke="#2A2A2A" stroke-width="1"/>

      <!-- Tick marks -->
      <line x1="70"  y1="228" x2="70"  y2="232" stroke="#2A2A2A" stroke-width="1"/>
      <line x1="162" y1="228" x2="162" y2="232" stroke="#2A2A2A" stroke-width="1"/>
      <line x1="253" y1="228" x2="253" y2="232" stroke="#28CA41" stroke-width="1.5"/>
      <line x1="345" y1="228" x2="345" y2="232" stroke="#2A2A2A" stroke-width="1"/>
      <line x1="437" y1="228" x2="437" y2="232" stroke="#2A2A2A" stroke-width="1"/>
      <line x1="529" y1="228" x2="529" y2="232" stroke="#FF4444" stroke-width="1.5"/>
      <line x1="625" y1="228" x2="625" y2="232" stroke="#2A2A2A" stroke-width="1"/>

      <!-- Threshold line @ 500ms -->
      <line x1="70" y1="117" x2="625" y2="117" stroke="#D4820A" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.85"/>
      <text x="628" y="121" fill="#D4820A" font-size="11" opacity="1">500ms</text>

      <!-- Area fill -->
      <polygon points="70,214 116,212 162,210 208,207 253,202 299,196 345,188 391,177 437,162 483,140 529,114 575,86 621,62 625,62 625,230 70,230" fill="rgba(91,141,239,0.09)"/>

      <!-- Latency line -->
      <polyline points="70,214 116,212 162,210 208,207 253,202 299,196 345,188 391,177 437,162 483,140 529,114 575,86 621,62" fill="none" stroke="#5B8DEF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Predictive flag @ h4 -->
      <line x1="253" y1="202" x2="253" y2="232" stroke="#28CA41" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
      <circle cx="253" cy="202" r="5" fill="#28CA41"/>
      <line x1="253" y1="202" x2="165" y2="155" stroke="#28CA41" stroke-width="1" opacity="0.7"/>
      <rect x="72" y="138" width="152" height="34" fill="rgba(22,22,22,0.95)" stroke="#28CA41" stroke-width="1" rx="1"/>
      <text x="82" y="152" fill="#28CA41" font-size="11" font-weight="bold">PREDICTIVE FLAG</text>
      <text x="82" y="165" fill="#28CA41" font-size="10" opacity="0.9">pattern detected at h4</text>

      <!-- 6h early warning span — pushed below x-axis labels to avoid collision -->
      <line x1="253" y1="276" x2="529" y2="276" stroke="#5B8DEF" stroke-width="1" opacity="0.6" stroke-dasharray="2,3"/>
      <polygon points="253,273 261,276 253,279" fill="#5B8DEF" opacity="0.6"/>
      <polygon points="529,273 521,276 529,279" fill="#5B8DEF" opacity="0.6"/>
      <text x="391" y="272" fill="#5B8DEF" font-size="10" text-anchor="middle" opacity="0.85">← 6h early warning →</text>

      <!-- Threshold breach @ h10 -->
      <circle cx="529" cy="114" r="5" fill="#FF4444"/>
      <line x1="529" y1="114" x2="529" y2="232" stroke="#FF4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
      <line x1="529" y1="114" x2="580" y2="148" stroke="#FF4444" stroke-width="1" opacity="0.7"/>
      <rect x="463" y="148" width="155" height="46" fill="rgba(22,22,22,0.95)" stroke="#FF4444" stroke-width="1" rx="1"/>
      <text x="473" y="162" fill="#FF4444" font-size="11" font-weight="bold">THRESHOLD BREACH</text>
      <text x="473" y="175" fill="#FF4444" font-size="10" opacity="0.9">alert fires — h10,</text>
      <text x="473" y="187" fill="#FF4444" font-size="10" opacity="0.9">users impacted</text>

      <!-- Customer impact label — readable, no opacity suppression -->
      <text x="440" y="76" fill="#FF8888" font-size="10">CUSTOMER</text>
      <text x="440" y="89" fill="#FF8888" font-size="10">IMPACT</text>

      <!-- Y-axis labels -->
      <text x="65" y="233" fill="#A8A8A0" font-size="11" text-anchor="end">0</text>
      <text x="65" y="195" fill="#A8A8A0" font-size="11" text-anchor="end">250ms</text>
      <text x="65" y="120" fill="#A8A8A0" font-size="11" text-anchor="end">500ms</text>
      <text x="65" y="63"  fill="#A8A8A0" font-size="11" text-anchor="end">750ms</text>
      <text x="16" y="148" fill="#A8A8A0" font-size="11" text-anchor="middle" transform="rotate(-90 16 148)">p99 LATENCY</text>

      <!-- X-axis labels -->
      <text x="70"  y="244" fill="#A8A8A0" font-size="11" text-anchor="middle">0h</text>
      <text x="162" y="244" fill="#A8A8A0" font-size="11" text-anchor="middle">2h</text>
      <text x="253" y="262" fill="#28CA41" font-size="11" text-anchor="middle">4h</text>
      <text x="345" y="244" fill="#A8A8A0" font-size="11" text-anchor="middle">6h</text>
      <text x="437" y="244" fill="#A8A8A0" font-size="11" text-anchor="middle">8h</text>
      <text x="529" y="262" fill="#FF4444" font-size="11" text-anchor="middle">10h</text>
      <text x="625" y="244" fill="#A8A8A0" font-size="11" text-anchor="middle">12h</text>
      <text x="347" y="294" fill="#A8A8A0" font-size="11" text-anchor="middle">TIME (hours after memory leak starts)</text>

      <!-- Legend -->
      <line x1="72" y1="320" x2="94" y2="320" stroke="#5B8DEF" stroke-width="2.5"/>
      <text x="99" y="324" fill="#5B8DEF" font-size="11">p99 latency</text>
      <line x1="200" y1="320" x2="222" y2="320" stroke="#D4820A" stroke-width="1.5" stroke-dasharray="6,3"/>
      <text x="227" y="324" fill="#D4820A" font-size="11">alert threshold</text>
      <circle cx="345" cy="320" r="4" fill="#28CA41"/>
      <text x="353" y="324" fill="#28CA41" font-size="11">predictive flag</text>
      <circle cx="476" cy="320" r="4" fill="#FF4444"/>
      <text x="484" y="324" fill="#FF4444" font-size="11">threshold breach</text>
    </svg>
  </div>
  <figcaption>Fig. 2 — A predictive model flags the leak 6 hours before the alert threshold breaks. By then, customers were already calling.</figcaption>
</figure>

<figure class="diagram">
  <div class="diag-card" style="padding:1.2rem 1rem 1rem;">
    <svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="atd-title atd-desc"
         style="width:100%;display:block;font-family:var(--font-code);">
      <title id="atd-title">Two alert designs for the same incident</title>
      <desc id="atd-desc">Two alert designs for the same incident, shown as side-by-side panels. The left panel, "with a next step", has just two steps: the alert arrives already carrying what's broken, how fast the budget is burning, the gathered context, and the first three steps, so the engineer acts immediately — seconds to first action. The right panel, "just a notification", is a six-step manual hunt: the alert fires with no context, then the engineer opens a dashboard, finds the right graph, searches the runbook, and finds the right section, losing about fifteen minutes before the first action.</desc>

      <rect x="0" y="0" width="760" height="400" fill="var(--fig-bg)"/>

      <!-- eyebrow -->
      <text x="24" y="30" fill="var(--heading)" font-family="'Press Start 2P',monospace" font-size="11" letter-spacing="0.04em">TWO DESIGNS, ONE INCIDENT</text>
      <text x="24" y="46" fill="var(--text)" font-size="11">// same condition (payment error rate), two alert bodies</text>

      <!-- ───────────── LEFT PANEL: with a next step ───────────── -->
      <rect x="8" y="58" width="366" height="330" fill="var(--fig-bg)" rx="1"/>
      <rect x="8" y="58" width="366" height="2" fill="var(--green)"/>
      <text x="191" y="79" fill="var(--green)" font-size="10" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.06em">WITH A NEXT STEP</text>

      <!-- A1: the alert carries everything -->
      <rect x="24" y="94" width="334" height="60" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="191" y="116" fill="var(--text)" font-size="11" text-anchor="middle">Alert arrives carrying:</text>
      <text x="191" y="131" fill="var(--heading)" font-size="11" text-anchor="middle">what&rsquo;s broken &#183; how fast &#183;</text>
      <text x="191" y="146" fill="var(--heading)" font-size="11" text-anchor="middle">context &#183; first 3 steps</text>

      <!-- arrow -->
      <line x1="191" y1="154" x2="191" y2="166" stroke="var(--green)" stroke-width="1.5"/>
      <polygon points="186,162 196,162 191,168" fill="var(--green)"/>

      <!-- A2: acts immediately -->
      <rect x="24" y="170" width="334" height="32" fill="var(--info-bg)" stroke="var(--green)" stroke-width="1"/>
      <text x="191" y="190" fill="var(--green)" font-size="11" text-anchor="middle">Engineer acts immediately</text>

      <!-- the skipped work, explained -->
      <text x="191" y="262" fill="var(--text)" font-size="11" text-anchor="middle" font-style="italic">The four answers ride with the alert &#8212;</text>
      <text x="191" y="278" fill="var(--text)" font-size="11" text-anchor="middle" font-style="italic">none of the hunting at right is needed.</text>

      <!-- outcome chip (parallels the right panel) -->
      <rect x="24" y="324" width="334" height="32" fill="var(--info-bg)" stroke="var(--green)" stroke-width="1.5"/>
      <text x="191" y="344" fill="var(--green)" font-size="11" text-anchor="middle">&#10003; seconds to first action</text>

      <!-- ───────────── RIGHT PANEL: just a notification ───────────── -->
      <rect x="386" y="58" width="366" height="330" fill="var(--fig-bg)" rx="1"/>
      <rect x="386" y="58" width="366" height="2" fill="var(--danger)"/>
      <text x="569" y="79" fill="var(--danger)" font-size="10" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.06em">JUST A NOTIFICATION</text>

      <!-- B1 -->
      <rect x="402" y="94" width="334" height="32" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="569" y="114" fill="var(--text)" font-size="11" text-anchor="middle">Alert fires &#8212; no context</text>
      <line x1="569" y1="126" x2="569" y2="136" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="564,132 574,132 569,138" fill="var(--danger)"/>

      <!-- B2 -->
      <rect x="402" y="140" width="334" height="32" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="569" y="160" fill="var(--text)" font-size="11" text-anchor="middle">Open dashboard</text>
      <line x1="569" y1="172" x2="569" y2="182" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="564,178 574,178 569,184" fill="var(--danger)"/>

      <!-- B3 -->
      <rect x="402" y="186" width="334" height="32" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="569" y="206" fill="var(--text)" font-size="11" text-anchor="middle">Find the right graph</text>
      <line x1="569" y1="218" x2="569" y2="228" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="564,224 574,224 569,230" fill="var(--danger)"/>

      <!-- B4 -->
      <rect x="402" y="232" width="334" height="32" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="569" y="252" fill="var(--text)" font-size="11" text-anchor="middle">Search the runbook</text>
      <line x1="569" y1="264" x2="569" y2="274" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="564,270 574,270 569,276" fill="var(--danger)"/>

      <!-- B5 -->
      <rect x="402" y="278" width="334" height="32" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="569" y="298" fill="var(--text)" font-size="11" text-anchor="middle">Find the right section</text>
      <line x1="569" y1="310" x2="569" y2="320" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="564,316 574,316 569,322" fill="var(--danger)"/>

      <!-- B6: outcome -->
      <rect x="402" y="324" width="334" height="32" fill="var(--dgr-bg)" stroke="var(--danger)" stroke-width="1.5"/>
      <text x="569" y="344" fill="var(--danger)" font-size="11" text-anchor="middle">&#10007; ~15 min to first action</text>
    </svg>
  </div>
  <figcaption>Fig. &#8212; Same incident, two alert bodies. The one that carries its own next step turns a fifteen-minute hunt into a single move.</figcaption>
</figure>

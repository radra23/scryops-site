<figure class="diagram">
  {{- /* No overflow:hidden here: an inline value outranks telemetry.css's
       .diag-card{overflow-x:auto} and clipped the chart on phones with no
       way to reach it. Padding only; the card pans instead.
       Label sizing is measured, not assumed: the 760-unit viewBox renders
       at ~689px on desktop (x0.907), so 13.5-unit labels land at ~12.2px
       and 11.5-unit pixel eyebrows at ~10.4px, the brief's floors. The
       SVG's inline min-width:680px (over the global 636px) holds phones
       at x0.895 so they keep >=12px / >=10px too; it stays under the
       ~689px desktop content box so desktop never scrolls. Label text
       sits on --mc-ink-secondary or brighter (>=11:1 in every theme);
       ramp/muted tones are for marks, not words. */ -}}
  <div class="diag-card" style="padding:0.9rem 0.9rem 0.6rem;">
    <svg viewBox="0 0 760 376" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="ovc-title ovc-desc"
         style="width:100%;min-width:680px;display:block;font-family:var(--font-code);">
      <title id="ovc-title">Telemetry volume and cost as scale grows: monitoring versus observability</title>
      <desc id="ovc-desc">A chart with telemetry volume and cost on the vertical axis and scale — traffic multiplied by cardinality — on the horizontal axis. Two curves start together at low scale. The monitoring curve rises slightly and then flattens to a plateau, because a fixed set of pre-aggregated metric series stays bounded. The observability curve keeps accelerating upward, because raw events and traces grow with both traffic and the number of distinct attribute values. The widening gap between the two curves is shaded and labelled the cost of being able to ask arbitrary questions.</desc>

      <rect x="0" y="0" width="760" height="376" fill="var(--fig-bg)"/>

      <!-- eyebrow -->
      <text x="78" y="30" fill="var(--heading)" font-family="var(--font-pixel)" font-size="11.5" letter-spacing="0.04em">DATA VOLUME vs. SCALE</text>
      <text x="78" y="47" fill="var(--mc-ink-secondary)" font-size="13.5">// monitoring stays bounded &#8212; observability climbs with cardinality</text>

      <!-- grid -->
      <g stroke="var(--fig-bg)" stroke-width="1">
        <line x1="78" y1="240" x2="730" y2="240"/>
        <line x1="78" y1="180" x2="730" y2="180"/>
        <line x1="78" y1="120" x2="730" y2="120"/>
      </g>
      <!-- axes -->
      <line x1="78" y1="62" x2="78" y2="300" stroke="var(--border)" stroke-width="1"/>
      <line x1="78" y1="300" x2="730" y2="300" stroke="var(--border)" stroke-width="1"/>
      <text x="22" y="180" fill="var(--mc-ink-secondary)" font-size="13.5" transform="rotate(-90 22 180)" text-anchor="middle">telemetry volume &amp; cost &#8594;</text>
      <text x="404" y="324" fill="var(--mc-ink-secondary)" font-size="13.5" text-anchor="middle">scale &#8594; (traffic &#215; cardinality)</text>

      <!-- gap fill between the two curves -->
      <path d="M78,288 L160,280 240,268 330,248 430,213 540,162 640,108 730,72 L730,247 640,248 540,250 430,254 330,260 240,268 160,278 78,288 Z" fill="var(--warn)" fill-opacity="0.10"/>

      <!-- monitoring curve (bounded, plateaus) -->
      <polyline fill="none" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"
        points="78,288 160,278 240,268 330,260 430,254 540,250 640,248 730,247"/>
      <circle cx="730" cy="247" r="4" fill="none" stroke="var(--cyan)" stroke-width="2"/>
      <!-- observability curve (super-linear, the one this figure is about) -->
      <polyline fill="none" stroke="var(--warn)" stroke-width="2.6" stroke-linejoin="round"
        points="78,288 160,280 240,268 330,248 430,213 540,162 640,108 730,72"/>
      <circle cx="730" cy="72" r="4.5" fill="var(--warn)"/>

      <!-- curve labels (colour ties each label to its line) -->
      <text x="306" y="108" fill="var(--heading)" font-size="13.5">observability</text>
      <text x="306" y="124" fill="var(--mc-ink-secondary)" font-size="13.5">raw events &#183; high-cardinality</text>
      <text x="628" y="262" fill="var(--cyan)" font-size="13.5">monitoring</text>
      <text x="628" y="278" fill="var(--mc-ink-secondary)" font-size="13.5">bounded series</text>

      <!-- gap label -->
      <text x="566" y="206" fill="var(--text)" font-size="13.5">the bill</text>
    </svg>
  </div>
  <figcaption>Fig. &#8212; Monitoring's data is bounded by the series you defined in advance; observability's grows with every new dimension you can ask about. That widening gap is the bill &#8212; and the reason sampling and retention tiers exist.</figcaption>
</figure>

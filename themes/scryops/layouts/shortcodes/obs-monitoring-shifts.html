<figure class="diagram" aria-label="Comparison table: Traditional Monitoring versus Observable System across three dimensions — when each responds, how much it sees, and what questions it can answer.">
  <table class="obs-table" aria-describedby="obs-shifts-desc">
    <caption id="obs-shifts-desc" style="caption-side:bottom;font-size:0.7rem;color:#A8A8A0;font-style:italic;text-align:left;padding:0.5rem 0.2rem 0;display:none;">
      Three shifts that define the move from traditional monitoring to an observable system.
    </caption>
    <thead>
      <tr>
        <th scope="col" style="width:22%" aria-label="Dimension"></th>
        <th scope="col" class="v1">Traditional Monitoring</th>

    </thead>

      <tr>
        <td>When it acts</td>

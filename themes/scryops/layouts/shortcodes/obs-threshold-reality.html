<figure class="diagram">
  <div class="diag-card" style="padding:0.9rem 0.9rem 0.6rem;overflow:hidden;">
    <svg viewBox="0 0 760 376" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="thr-title thr-desc"
         style="width:100%;display:block;font-family:var(--font-code);">
      <title id="thr-title">Static threshold versus a real 24-hour traffic pattern</title>
      <desc id="thr-desc">A service metric over 24 hours follows a diurnal curve: low overnight, a large midday and afternoon peak. A single flat alert threshold is drawn across it. During the normal afternoon peak the metric rises above the line and fires false alarms. At 3am a real incident spikes the metric well above its overnight baseline, but it stays just under the daytime-tuned threshold, so no alert fires and the incident is missed.</desc>

      <rect x="0" y="0" width="760" height="376" fill="var(--fig-bg)"/>

      <text x="82" y="30" fill="var(--heading)" font-family="'Press Start 2P',monospace" font-size="11" letter-spacing="0.04em">STATIC THRESHOLD vs. REALITY</text>
      <text x="82" y="47" fill="var(--muted)" font-size="11">// one fixed line, 24 hours of real traffic</text>

      <!-- grid -->
      <line x1="78" y1="239" x2="730" y2="239" stroke="var(--fig-bg)" stroke-width="1"/>
      <line x1="78" y1="178" x2="730" y2="178" stroke="var(--fig-bg)" stroke-width="1"/>
      <line x1="78" y1="117" x2="730" y2="117" stroke="var(--fig-bg)" stroke-width="1"/>
      <g stroke="var(--fig-bg)" stroke-width="1">
        <line x1="241" y1="56" x2="241" y2="300"/>
        <line x1="404" y1="56" x2="404" y2="300"/>
        <line x1="567" y1="56" x2="567" y2="300"/>
      </g>
      <!-- axes -->
      <line x1="78" y1="56" x2="78" y2="300" stroke="var(--border)" stroke-width="1"/>
      <line x1="78" y1="300" x2="730" y2="300" stroke="var(--border)" stroke-width="1"/>
      <text x="20" y="178" fill="var(--muted)" font-size="10" transform="rotate(-90 20 178)">service latency / error rate</text>

      <!-- false-alarm fill (curve above threshold, midday) -->
      <path d="M382,129.2 L383.6,128.6 387.0,124.9 390.4,121.4 393.8,117.9 397.2,114.5 400.6,111.3 404.0,108.4 407.4,105.6 410.8,103.1 414.2,100.8 417.6,98.9 421.0,97.2 424.4,95.9 427.8,94.8 431.2,94.1 434.6,93.7 438.0,93.5 441.4,93.7 444.8,94.1 448.1,94.7 451.5,95.6 454.9,96.6 458.3,97.9 461.7,99.2 465.1,100.7 468.5,102.2 471.9,103.8 475.3,105.5 478.7,107.2 482.1,108.9 485.5,110.7 488.9,112.4 492.3,114.2 495.7,116.1 499.1,118.0 502.5,119.9 505.9,121.9 509.3,124.1 512.7,126.4 516.1,128.8 517,129.2 Z" fill="var(--danger)" fill-opacity="0.15"/>

      <!-- expected pattern (dashed) -->
      <polyline fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85" points="78.0,253.6 112.0,253.6 145.9,253.6 179.9,253.5 213.8,252.8 244.4,249.1 268.2,239.6 295.3,217.8 322.5,190.1 349.7,164.0 376.8,136.0 404.0,108.4 431.2,94.1 458.3,97.9 485.5,110.7 512.7,126.4 539.8,151.6 567.0,188.6 594.2,223.4 621.3,243.7 648.5,251.4 682.5,253.4 716.4,253.6 730.0,253.6"/>

      <!-- threshold line -->
      <line x1="78" y1="129.2" x2="730" y2="129.2" stroke="var(--warn)" stroke-width="2"/>
      <text x="726" y="123" text-anchor="end" fill="var(--warn)" font-size="10" letter-spacing="0.04em">ALERT THRESHOLD</text>

      <!-- observed metric (solid) -->
      <polyline fill="none" stroke="var(--cyan)" stroke-width="2.4" stroke-linejoin="round" points="78.0,253.6 105.2,253.6 118.8,253.6 122.1,253.4 125.5,253.1 128.9,252.1 132.3,250.1 135.7,245.9 139.1,238.4 142.5,226.8 145.9,210.9 149.3,192.3 152.7,174.2 156.1,160.9 159.5,156.0 162.9,160.9 166.3,174.2 169.7,192.3 173.1,210.9 176.5,226.7 179.9,238.3 183.3,245.7 186.7,249.9 190.1,252.0 193.5,252.9 200.2,253.2 213.8,252.8 234.2,251.0 254.6,246.1 275.0,235.2 295.3,217.8 315.7,197.0 336.1,176.9 356.5,157.4 376.8,136.0 397.2,114.5 417.6,98.9 431.2,94.1 444.8,94.1 461.7,99.2 478.7,107.2 495.7,116.1 512.7,126.4 529.6,140.5 546.6,160.1 563.6,183.7 580.6,207.3 597.6,226.8 614.5,240.1 631.5,247.7 648.5,251.4 668.9,253.0 692.6,253.5 716.4,253.6 730.0,253.6"/>

      <!-- false-alarm overstroke (red) -->
      <polyline fill="none" stroke="var(--danger)" stroke-width="2.6" stroke-linejoin="round" points="383.6,128.6 390.4,121.4 397.2,114.5 404.0,108.4 410.8,103.1 417.6,98.9 424.4,95.9 431.2,94.1 438.0,93.5 444.8,94.1 451.5,95.6 458.3,97.9 465.1,100.7 471.9,103.8 478.7,107.2 485.5,110.7 492.3,114.2 499.1,118.0 505.9,121.9 512.7,126.4 516.1,128.8"/>

      <!-- false-alarm callout -->
      <text x="150" y="92" fill="var(--danger)" font-family="'Press Start 2P',monospace" font-size="9" letter-spacing="0.03em">&#10007; FALSE ALARMS</text>
      <text x="150" y="108" fill="var(--muted)" font-size="10">normal afternoon peak</text>
      <text x="150" y="122" fill="var(--muted)" font-size="10">trips a fixed line</text>
      <path d="M300,104 C340,108 360,112 392,120" fill="none" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3 3"/>
      <polygon points="392,120 385,116 387,123" fill="var(--danger)"/>

      <!-- incident marker -->
      <line x1="159.5" y1="129.2" x2="159.5" y2="156" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="155" y1="129.2" x2="164" y2="129.2" stroke="var(--danger)" stroke-width="1"/>
      <circle cx="159.5" cy="156" r="6" fill="var(--fig-bg)" stroke="var(--danger)" stroke-width="2"/>
      <circle cx="159.5" cy="156" r="2" fill="var(--danger)"/>
      <text x="173" y="150" fill="var(--danger)" font-family="'Press Start 2P',monospace" font-size="9" letter-spacing="0.03em">&#10007; MISSED</text>
      <text x="173" y="167" fill="var(--muted)" font-size="10">real 3am incident &#8212;</text>
      <text x="173" y="181" fill="var(--muted)" font-size="10">never crosses the line,</text>
      <text x="173" y="195" fill="var(--muted)" font-size="10">so no page fires</text>

      <!-- x ticks -->
      <g fill="var(--muted)" font-size="10" text-anchor="middle">
        <text x="78" y="316">00:00</text>
        <text x="241" y="316">06:00</text>
        <text x="404" y="316">12:00</text>
        <text x="567" y="316">18:00</text>
        <text x="730" y="316">24:00</text>
      </g>
      <text x="159.5" y="316" text-anchor="middle" fill="var(--danger)" font-size="9">03:00</text>
      <line x1="159.5" y1="300" x2="159.5" y2="305" stroke="var(--danger)" stroke-width="1"/>

      <!-- divider + legend -->
      <line x1="24" y1="338" x2="736" y2="338" stroke="var(--border)" stroke-width="1"/>
      <g font-size="10" fill="var(--muted)">
        <line x1="80" y1="356" x2="104" y2="356" stroke="var(--cyan)" stroke-width="2.4"/>
        <text x="110" y="360">observed</text>
        <line x1="210" y1="356" x2="234" y2="356" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/>
        <text x="240" y="360">expected pattern</text>
        <line x1="392" y1="356" x2="416" y2="356" stroke="var(--warn)" stroke-width="2"/>
        <text x="422" y="360">static threshold</text>
        <text x="556" y="360" fill="var(--danger)">&#10007;</text>
        <text x="570" y="360">false alarm / missed</text>
      </g>
    </svg>
  </div>
  <figcaption>Fig. &#8212; A single static line can&rsquo;t be right at both 3am and 2pm. Tune it for the daytime peak and it goes blind to a real overnight incident; tune it for the quiet hours and it screams through every normal afternoon.</figcaption>
</figure>

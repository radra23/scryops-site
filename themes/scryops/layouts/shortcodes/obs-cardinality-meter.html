  <figcaption>Fig. &#8212; A single Prometheus instance has a hard ceiling near 2,000,000 active series &#8212; cross it and scrapes time out or it OOMs. Long before that, the cost compounds: the same panel that takes 2s at 10k series takes 200s at 1M. Watch the gauge, not just the bill.</figcaption>

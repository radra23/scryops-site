  <figcaption>Fig. &#8212; Cardinality is a high-score you do <em>not</em> want to win. A bounded label set stays a safe 1,600 series; one unbounded label (user_id) blasts past the ~2,000,000 ceiling into OOM territory. Bound every label to a known set. Above ~2,000,000 active series a single Prometheus starts to OOM and scrapes time out &#8212; one unbounded label is all it takes.</figcaption>

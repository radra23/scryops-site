<figure class="diagram">
  <div class="diag-card" style="padding:0.9rem 0.9rem 0.6rem;overflow:hidden;">
    <svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="tv-title tv-desc"
         style="width:100%;display:block;font-family:var(--font-code);">
      <title id="tv-title">Log volume and daily storage across four traffic tiers</title>
      <desc id="tv-desc">A log-scale bar chart of logs per second for four service tiers: small (100 requests/second, 500 logs/second, 4.3 GB/day), medium (1,000 rps, 8,000 logs/second, 69 GB/day), high-traffic (10,000 rps, 120,000 logs/second, 1 TB/day), and internet scale (100,000 rps, 1.5 million logs/second, 13 TB/day). The bars climb far faster than traffic because both request rate and log lines per request grow from tier to tier.</desc>

      <rect x="0" y="0" width="760" height="360" fill="var(--fig-bg)"/>

      <text x="92" y="28" fill="var(--warn)" font-family="'Press Start 2P',monospace" font-size="11" letter-spacing="0.04em">LOG VOLUME vs. TRAFFIC</text>
      <text x="92" y="45" fill="var(--muted)" font-size="11">// 1000&#215; the traffic, 3000&#215; the logs &#8212; and 13 TB/day to store</text>

      <g stroke="var(--fig-bg)" stroke-width="1">
        <line x1="92" y1="300" x2="740" y2="300"/>
        <line x1="92" y1="254" x2="740" y2="254"/>
        <line x1="92" y1="208" x2="740" y2="208"/>
        <line x1="92" y1="162" x2="740" y2="162"/>
        <line x1="92" y1="116" x2="740" y2="116"/>
        <line x1="92" y1="70"  x2="740" y2="70"/>
      </g>
      <g fill="var(--muted)" font-size="9" text-anchor="end">
        <text x="86" y="303">100</text>
        <text x="86" y="257">1K</text>
        <text x="86" y="211">10K</text>
        <text x="86" y="165">100K</text>
        <text x="86" y="119">1M</text>
        <text x="86" y="73">10M</text>
      </g>
      <text x="24" y="190" fill="var(--muted)" font-size="10" transform="rotate(-90 24 190)" text-anchor="middle">logs / second &#8594;</text>

      <line x1="92" y1="70" x2="92" y2="300" stroke="var(--border)" stroke-width="1"/>
      <line x1="92" y1="300" x2="740" y2="300" stroke="var(--border)" stroke-width="1"/>

      <!-- Small -->
      <rect x="130" y="268" width="70" height="32" fill="var(--mc-ramp-4)" stroke="var(--mc-ink)" stroke-width="1"/>
      <text x="165" y="262" fill="var(--heading)" font-size="11" text-anchor="middle">4.3 GB</text>
      <!-- Medium -->
      <rect x="295" y="212" width="70" height="88" fill="var(--mc-ramp-3)" stroke="var(--mc-ink)" stroke-width="1"/>
      <text x="330" y="206" fill="var(--heading)" font-size="11" text-anchor="middle">69 GB</text>
      <!-- High-traffic -->
      <rect x="460" y="158" width="70" height="142" fill="var(--mc-ramp-2)" stroke="var(--mc-ink)" stroke-width="1"/>
      <text x="495" y="152" fill="var(--heading)" font-size="11" text-anchor="middle">1 TB</text>
      <!-- Internet scale (the ceiling) — emphasis via a heavier ink outline + bold, larger
           label, not colour, matching the monochrome value-ramp system's other charts
           (e.g. the emphasized span in obs-trace-waterfall.html uses the same pattern). -->
      <rect x="625" y="108" width="70" height="192" fill="var(--mc-ramp-1)" stroke="var(--mc-ink)" stroke-width="2"/>
      <text x="660" y="101" fill="var(--mc-ink)" font-size="12" text-anchor="middle" font-weight="700">13 TB/day</text>

      <g font-family="'Press Start 2P',monospace" font-size="9" fill="var(--muted)" text-anchor="middle" letter-spacing="0.02em">
        <text x="165" y="318">SMALL</text>
        <text x="330" y="318">MEDIUM</text>
        <text x="495" y="318">HIGH</text>
        <text x="660" y="318">INTERNET</text>
      </g>
      <g font-size="9" fill="var(--muted)" text-anchor="middle">
        <text x="165" y="333">100 rps &#183; 500/s</text>
        <text x="330" y="333">1K rps &#183; 8K/s</text>
        <text x="495" y="333">10K rps &#183; 120K/s</text>
        <text x="660" y="333">100K rps &#183; 1.5M/s</text>
      </g>
    </svg>
  </div>
  <figcaption>Fig. &#8212; Traffic rises 1000&#215; from a small service to internet scale, but log volume rises ~3000&#215; &#8212; because requests/second and log-lines/request both climb. The punchline is the daily storage above each bar: 4.3 GB becomes 13 TB.</figcaption>
</figure>

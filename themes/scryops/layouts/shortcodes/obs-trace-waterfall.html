<figure class="diagram"
  aria-label="A distributed trace for one GET /checkout request, drawn as a waterfall of six spans across 240 milliseconds. The root request span runs the full width. Nested beneath it: auth.verify (16ms) and a SELECT cart_items query (32ms), both auto-instrumented, marked with a thin solid border. Then payment.process (152ms), a manual business span marked with a heavier solid border, holding most of the request's time. Nested under it, an outbound POST to api.stripe.com/charge (130ms), also auto-instrumented. Finally an UPDATE orders query (20ms) that failed, marked with a dashed border and a cross. Most of the latency lives inside the manual payment span, waiting on the outbound Stripe call.">
  <div class="diag-card" style="padding:0.9rem;">
    <svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="tw-title tw-desc" shape-rendering="crispEdges"
         style="width:100%;display:block;font-family:var(--font-code);">
      <title id="tw-title">Trace Waterfall — one GET /checkout request</title>
      <desc id="tw-desc">Six spans across 240 milliseconds. Auto-instrumented HTTP and database spans carry a thin solid border; the manual payment.process span, marked with a heavier border, holds most of the duration; the outbound Stripe call nests beneath it; and a final UPDATE orders span fails, marked with a dashed border and a cross.</desc>

      <rect width="760" height="360" fill="var(--fig-bg)"/>

      <!-- eyebrow -->
      <text x="24" y="30" fill="var(--heading)" font-family="'Press Start 2P',monospace" font-size="11" letter-spacing="0.04em">TRACE WATERFALL</text>
      <text x="24" y="48" fill="var(--text)" font-size="12.5">// one request, GET /checkout &#183; where the 240 ms went</text>

      <!-- time axis gridlines + labels -->
      <line x1="288" y1="80" x2="288" y2="312" stroke="var(--border)" stroke-width="1"/>
      <line x1="391" y1="80" x2="391" y2="312" stroke="var(--border)" stroke-width="1"/>
      <line x1="494" y1="80" x2="494" y2="312" stroke="var(--border)" stroke-width="1"/>
      <line x1="597" y1="80" x2="597" y2="312" stroke="var(--border)" stroke-width="1"/>
      <line x1="700" y1="80" x2="700" y2="312" stroke="var(--border)" stroke-width="1"/>
      <text x="288" y="72" fill="var(--muted)" font-size="12.5" text-anchor="start">0 ms</text>
      <text x="391" y="72" fill="var(--muted)" font-size="12.5" text-anchor="middle">60</text>
      <text x="494" y="72" fill="var(--muted)" font-size="12.5" text-anchor="middle">120</text>
      <text x="597" y="72" fill="var(--muted)" font-size="12.5" text-anchor="middle">180</text>
      <text x="700" y="72" fill="var(--muted)" font-size="12.5" text-anchor="end">240</text>

      <!-- row 1: root request span (auto / blue) -->
      <rect x="288" y="88" width="412" height="20" fill="var(--mc-ramp-3)" stroke="var(--mc-border)" stroke-width="1"/>
      <text x="24" y="102" fill="var(--text)" font-size="12.5">GET /checkout</text>
      <text x="706" y="102" fill="var(--mc-ramp-3)" font-size="12.5" text-anchor="start">240 ms</text>

      <!-- row 2: auth.verify (auto / blue) -->
      <rect x="302" y="128" width="27" height="20" fill="var(--mc-ramp-3)" stroke="var(--mc-border)" stroke-width="1"/>
      <text x="40" y="142" fill="var(--text)" font-size="12.5">auth.verify</text>
      <text x="335" y="142" fill="var(--mc-ramp-3)" font-size="12.5">16 ms</text>

      <!-- row 3: SELECT cart_items (auto / blue) -->
      <rect x="333" y="168" width="55" height="20" fill="var(--mc-ramp-3)" stroke="var(--mc-border)" stroke-width="1"/>
      <text x="40" y="182" fill="var(--text)" font-size="12.5">SELECT cart_items</text>
      <text x="394" y="182" fill="var(--mc-ramp-3)" font-size="12.5">32 ms</text>

      <!-- row 4: payment.process (MANUAL / amber) -->
      <rect x="394" y="208" width="261" height="20" fill="var(--mc-ramp-2)" stroke="var(--mc-ink)" stroke-width="2"/>
      <text x="40" y="222" fill="var(--mc-ramp-2)" font-size="12.5">payment.process</text>
      <text x="661" y="222" fill="var(--mc-ramp-2)" font-size="12.5" text-anchor="start">152 ms</text>

      <!-- row 5: outbound POST to stripe (auto / blue) -->
      <rect x="408" y="248" width="223" height="20" fill="var(--mc-ramp-3)" stroke="var(--mc-border)" stroke-width="1"/>
      <text x="56" y="262" fill="var(--text)" font-size="12.5">POST api.stripe.com/charge</text>
      <text x="637" y="262" fill="var(--mc-ramp-3)" font-size="12.5">130 ms</text>

      <!-- row 6: UPDATE orders (ERROR / red) -->
      <rect x="659" y="288" width="34" height="20" fill="var(--mc-ramp-1)" stroke="var(--mc-ink)" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="40" y="302" fill="var(--mc-ramp-1)" font-size="12.5">UPDATE orders &#10007;</text>
      <text x="699" y="302" fill="var(--mc-ramp-1)" font-size="12.5">20 ms</text>

      <!-- legend -->
      <line x1="24" y1="322" x2="736" y2="322" stroke="var(--border)" stroke-width="1"/>
      <rect x="24" y="333" width="11" height="11" fill="var(--mc-ramp-3)" stroke="var(--mc-border)" stroke-width="1"/>
      <text x="42" y="343" fill="var(--text)" font-size="12.5">auto-instrumented</text>
      <rect x="208" y="333" width="11" height="11" fill="var(--mc-ramp-2)" stroke="var(--mc-ink)" stroke-width="2"/>
      <text x="226" y="343" fill="var(--text)" font-size="12.5">manual span</text>
      <rect x="360" y="333" width="11" height="11" fill="var(--mc-ramp-1)" stroke="var(--mc-ink)" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="378" y="343" fill="var(--text)" font-size="12.5">error</text>
      <text x="700" y="343" fill="var(--muted)" font-size="12.5" text-anchor="end">total 240 ms</text>
    </svg>
  </div>
  <figcaption>Fig. &#8212; A trace is one request&rsquo;s story told in spans. The thin-bordered spans come free from auto-instrumentation; the heavier-bordered <code>payment.process</code> span is the one you added by hand &#8212; and the one holding the time. The dashed span is where it broke.</figcaption>
</figure>

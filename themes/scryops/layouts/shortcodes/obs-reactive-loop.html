<figure class="diagram" aria-label="Diagram comparing Observability 1.0 and 2.0 response models">
  <div class="diag-card">
    <!-- OBS 1.0 row -->
    <div class="flow-row" role="img" aria-label="Observability 1.0: threshold breach → alert fires → human paged → investigates → fix applied. Outcome: users already affected.">
      <span class="flow-version v1" aria-hidden="true">OBS 1.0</span>
      <div class="flow-box breach">threshold breach</div>
      <span class="flow-arrow bad" aria-hidden="true">→</span>
      <div class="flow-box damage">alert fires</div>
      <span class="flow-arrow bad" aria-hidden="true">→</span>
      <div class="flow-box human">human paged</div>
      <span class="flow-arrow bad" aria-hidden="true">→</span>
      <div class="flow-box human">investigates</div>
      <span class="flow-arrow bad" aria-hidden="true">→</span>
      <div class="flow-box human">fix applied</div>
      <span class="flow-outcome bad">✗ users already affected</span>
    </div>
    <div class="flow-divider"></div>
    <!-- OBS 2.0 row -->
    <div class="flow-row" role="img" aria-label="Observability 2.0: anomaly pattern → prediction → auto-remediation. Outcome: users never notice.">
      <span class="flow-version v2" aria-hidden="true">OBS 2.0</span>
      <div class="flow-box pattern">anomaly pattern</div>
      <span class="flow-arrow good" aria-hidden="true">→</span>
      <div class="flow-box predict">prediction</div>
      <span class="flow-arrow good" aria-hidden="true">→</span>
      <div class="flow-box prevent">auto-remediation</div>
      <span class="flow-outcome good">✓ users never notice</span>
    </div>
  </div>
  <figcaption>Fig. 1 — In the reactive model, a human is always last in line. Observability 2.0 closes the loop before the page fires.</figcaption>
</figure>

{{ $variant := .Get 0 | default "lightbulb" }}
<div class="insight {{ $variant }}">
  <div class="insight-icon" aria-hidden="true">
    {{ if eq $variant "lightbulb" }}
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M9 21h6M12 2a7 7 0 0 1 4 12.874V17H8v-2.126A7 7 0 0 1 12 2z"/>
      <line x1="9" y1="21" x2="9" y2="17"/><line x1="15" y1="21" x2="15" y2="17"/>
    </svg>
    {{ else if eq $variant "bookmark" }}
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    {{ end }}
  </div>
  <div class="insight-body">{{ .Inner | markdownify }}</div>
</div>

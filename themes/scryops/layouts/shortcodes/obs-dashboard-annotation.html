<figure class="diagram">
  <div class="diag-card" style="padding:1.2rem 1rem 1rem;">
    <svg viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="ann-title ann-desc"
         style="width:100%;display:block;font-family:'Commit Mono','Courier New',monospace;">
      <title id="ann-title">Time series panel without and with a deployment annotation</title>
      <desc id="ann-desc">Two-panel diagram. Left panel — WITHOUT ANNOTATIONS — shows a P99 latency time series with a visible spike but no contextual marker. A red label at the bottom reads "spike — cause unknown." Right panel — WITH ANNOTATIONS — shows the same latency curve in blue with a dashed amber vertical line at the deployment moment, labelled "DEPLOY v2.1.4" above and "14:32" at the baseline. A green label reads "deployment confirmed as cause."</desc>

      <rect width="760" height="230" fill="#161616"/>

      <!-- ── LEFT PANEL: without annotation ───────────────────────────── -->
      <rect x="8" y="8" width="344" height="214" fill="#111111" rx="1"/>
      <rect x="8" y="8" width="344" height="2" fill="#3A3A3A"/>
      <text x="180" y="26" fill="#808080" font-size="9" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.06em">WITHOUT ANNOTATIONS</text>

      <!-- axes -->
      <line x1="30" y1="44" x2="30" y2="184" stroke="#2A2A2A" stroke-width="1"/>
      <line x1="30" y1="184" x2="340" y2="184" stroke="#2A2A2A" stroke-width="1"/>
      <text x="22" y="114" fill="#3A3A3A" font-size="9" text-anchor="middle"
            transform="rotate(-90,22,114)">P99</text>

      <!-- faint grid lines -->
      <line x1="30" y1="104" x2="340" y2="104" stroke="#1A1A1A" stroke-width="1"/>
      <line x1="30" y1="144" x2="340" y2="144" stroke="#1A1A1A" stroke-width="1"/>

      <!-- latency curve (muted gray) -->
      <polyline fill="none" stroke="#555550" stroke-width="2"
        points="30,157 72,155 114,159 156,156 188,157 204,155 215,132 229,94 243,72 261,97 281,122 308,131 332,129 340,128"/>

      <!-- subtle danger region over spike -->
      <polygon points="210,44 340,44 340,184 210,184" fill="#FF6060" opacity="0.04"/>

      <!-- bottom label -->
      <text x="185" y="203" fill="#CC4444" font-size="10" text-anchor="middle">↗ spike — cause unknown</text>

      <!-- ── CENTER ARROW ───────────────────────────────────────────────── -->
      <text x="380" y="118" fill="#F5A623" font-size="18" text-anchor="middle">→</text>

      <!-- ── RIGHT PANEL: with annotation ─────────────────────────────── -->
      <rect x="408" y="8" width="344" height="214" fill="#111111" rx="1"/>
      <rect x="408" y="8" width="344" height="2" fill="#5B8DEF" opacity="0.8"/>
      <text x="580" y="26" fill="#5B8DEF" font-size="9" text-anchor="middle"
            font-family="'Press Start 2P',monospace" letter-spacing="0.06em">WITH ANNOTATIONS</text>

      <!-- axes -->
      <line x1="430" y1="44" x2="430" y2="184" stroke="#2A2A2A" stroke-width="1"/>
      <line x1="430" y1="184" x2="740" y2="184" stroke="#2A2A2A" stroke-width="1"/>
      <text x="422" y="114" fill="#3A3A3A" font-size="9" text-anchor="middle"
            transform="rotate(-90,422,114)">P99</text>

      <!-- faint grid lines -->
      <line x1="430" y1="104" x2="740" y2="104" stroke="#1A1A1A" stroke-width="1"/>
      <line x1="430" y1="144" x2="740" y2="144" stroke="#1A1A1A" stroke-width="1"/>

      <!-- latency curve (blue) -->
      <polyline fill="none" stroke="#5B8DEF" stroke-width="2"
        points="430,157 472,155 514,159 556,156 588,157 604,155 615,132 629,94 643,72 661,97 681,122 708,131 732,129 740,128"/>

      <!-- deployment annotation line (amber dashed) -->
      <line x1="603" y1="44" x2="603" y2="184" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- annotation marker (diamond at top) -->
      <polygon points="603,44 597,37 603,30 609,37" fill="#F5A623"/>

      <!-- annotation labels -->
      <text x="608" y="55" fill="#F5A623" font-size="9">DEPLOY v2.1.4</text>
      <text x="608" y="180" fill="#F5A623" font-size="9">14:32</text>

      <!-- bottom label -->
      <text x="580" y="203" fill="#28CA41" font-size="10" text-anchor="middle">↗ deployment confirmed as cause</text>

    </svg>
  </div>
  <figcaption>Fig. — A deployment annotation places a marker the moment the deployment metric fires. Without it, a latency spike is unexplained. With it, root cause narrows to one event before you open a second tab.</figcaption>
</figure>

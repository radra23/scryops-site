<style>
.rt-wrap{background:#161616;border:1px solid #2A2A2A;border-top:3px solid #F5A623;padding:1.4rem 1.4rem 1.2rem;font-family:'Commit Mono','Courier New',monospace;}
.rt-hdr{font-family:'Press Start 2P',monospace;font-size:.65rem;color:#A8A8A0;letter-spacing:.1em;text-align:center;margin-bottom:1.3rem;}
.rt-cols{display:grid;grid-template-columns:92px 1fr 1fr 132px;gap:.8rem;padding:0 .2rem .4rem;font-family:'Press Start 2P',monospace;font-size:.5rem;color:#808080;letter-spacing:.06em;}
.rt-cols span:last-child{text-align:right;}
@media(max-width:640px){.rt-cols{display:none;}}
.rt-lane{background:#0D0D0D;border:1px solid #2A2A2A;border-left:4px solid;display:grid;grid-template-columns:92px 1fr 1fr 132px;gap:.8rem;align-items:center;padding:.95rem .8rem;margin-bottom:.7rem;}
@media(max-width:640px){.rt-lane{grid-template-columns:1fr;gap:.55rem;}}
.rt-badge{display:flex;flex-direction:column;gap:.25rem;}
.rt-p{font-size:1.5rem;font-weight:700;line-height:1;}
.rt-burn{font-size:.6rem;color:#808080;letter-spacing:.04em;}
.rt-cell{font-size:.82rem;color:#D8D6CE;line-height:1.45;}
.rt-cell b{color:#F0EEE8;font-weight:700;}
.rt-cell small{display:block;color:#A8A8A0;font-size:.72rem;margin-top:.15rem;}
.rt-route{font-size:.82rem;color:#D8D6CE;line-height:1.45;}
.rt-route::before{content:"\2192";color:#5B8DEF;margin-right:.4rem;font-weight:700;}
@media(max-width:640px){.rt-route::before{content:"\2192 ";}}
.rt-tag{justify-self:end;font-family:'Press Start 2P',monospace;font-size:.5rem;letter-spacing:.04em;padding:.45rem .55rem;border:1px solid;text-align:center;line-height:1.4;}
@media(max-width:640px){.rt-tag{justify-self:start;}}
.rt-foot{margin-top:1rem;padding-top:.9rem;border-top:1px solid #2A2A2A;font-size:.8rem;color:#A8A8A0;line-height:1.5;}
.rt-foot b{color:#F5A623;}
figure.rt-fig{margin:2.5rem 0 2rem;}
figure.rt-fig figcaption{font-size:.7rem;color:#A8A8A0;font-style:italic;margin-top:.6rem;padding-left:.2rem;}
</style>

<figure class="rt-fig"
  aria-label="Alert routing by severity. P0, a fast burn of 14 times the budget over one hour, routes to a PagerDuty page that wakes on-call, and is allowed to interrupt a human immediately. P1, a moderate burn of 6 times over 6 hours, routes to an incident channel with a 30-minute response expectation during business hours. P2 and below, a slow burn of 2 times over 3 days or purely informational signals, route to a passive Slack channel or ticket queue reviewed weekly, and never interrupt anyone. The person asleep at 3am should only ever hear from the top lane.">
  <div class="rt-wrap">
    <div class="rt-hdr">ALERT ROUTING &nbsp;&middot;&nbsp; MATCH URGENCY TO INTERRUPTION</div>

    <div class="rt-cols"><span>SEVERITY</span><span>TRIGGER</span><span>ROUTE</span><span>WHO IT WAKES</span></div>

    <div class="rt-lane" style="border-left-color:#FF6060;">
      <div class="rt-badge"><span class="rt-p" style="color:#FF6060;">P0</span><span class="rt-burn">FAST BURN</span></div>
      <div class="rt-cell"><b>14&times; burn over 1 hour</b><small>error budget vanishing now</small></div>
      <div class="rt-route">PagerDuty &mdash; wake on-call<small style="display:block;color:#A8A8A0;font-size:.72rem;margin-top:.15rem;">immediate incident response</small></div>
      <div class="rt-tag" style="color:#FF6060;border-color:#FF6060;background:rgba(255,96,96,0.14);">WAKE<br>SOMEONE</div>
    </div>

    <div class="rt-lane" style="border-left-color:#F5A623;">
      <div class="rt-badge"><span class="rt-p" style="color:#F5A623;">P1</span><span class="rt-burn">MODERATE</span></div>
      <div class="rt-cell"><b>6&times; burn over 6 hours</b><small>degrading, not yet critical</small></div>
      <div class="rt-route">Incident channel &mdash; 30-min response<small style="display:block;color:#A8A8A0;font-size:.72rem;margin-top:.15rem;">team picks it up</small></div>
      <div class="rt-tag" style="color:#F5A623;border-color:#F5A623;background:rgba(245,166,35,0.13);">BUSINESS<br>HOURS</div>
    </div>

    <div class="rt-lane" style="border-left-color:#5B8DEF;">
      <div class="rt-badge"><span class="rt-p" style="color:#5B8DEF;">P2</span><span class="rt-burn">SLOW / INFO</span></div>
      <div class="rt-cell"><b>2&times; burn over 3 days</b><small>or purely informational</small></div>
      <div class="rt-route">Passive Slack / ticket queue<small style="display:block;color:#A8A8A0;font-size:.72rem;margin-top:.15rem;">reviewed weekly</small></div>
      <div class="rt-tag" style="color:#5B8DEF;border-color:#5B8DEF;background:rgba(91,141,239,0.13);">NO<br>INTERRUPTION</div>
    </div>

    <div class="rt-foot">The person asleep at 3am should only ever hear from the <b>top lane</b>. Everything else can wait for morning &mdash; and if it can&rsquo;t wait but also can&rsquo;t wake someone, it&rsquo;s in the wrong lane.</div>
  </div>
  <figcaption>Fig. &#8212; Not every fire alarm needs the fire department. Routing by burn rate keeps the 3am page rare enough that people still trust it.</figcaption>
</figure>

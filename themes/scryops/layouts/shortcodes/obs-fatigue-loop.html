<figure class="diagram">
  <div class="diag-card" style="padding:1.2rem 1rem 1rem;">
    <svg viewBox="0 0 760 224" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="afl-title afl-desc"
         style="width:100%;display:block;font-family:var(--font-code);">
      <title id="afl-title">The alert-fatigue feedback loop</title>
      <desc id="afl-desc">A self-reinforcing loop. High alert volume leads to desensitization as the on-call team tunes alerts out, which lets real issues slip by, which prompts the team to add still more alerts, which raises the volume again — and the cycle repeats, louder each round.</desc>

      <rect x="0" y="0" width="760" height="224" fill="var(--fig-bg)"/>

      <text x="24" y="26" fill="var(--heading)" font-family="'Press Start 2P',monospace" font-size="11" letter-spacing="0.04em">THE ALERT-FATIGUE LOOP</text>
      <text x="24" y="42" fill="var(--text)" font-size="11">// noisier alerts &#8594; more ignored &#8594; more missed &#8594; more added</text>

      <!-- nodes -->
      <rect x="16"  y="70" width="164" height="40" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="98"  y="94" fill="var(--text)" font-size="11" text-anchor="middle">High alert volume</text>

      <rect x="204" y="70" width="164" height="40" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="286" y="94" fill="var(--text)" font-size="11" text-anchor="middle">Desensitization</text>

      <rect x="392" y="70" width="164" height="40" fill="var(--surface)" stroke="var(--fig-bd)" stroke-width="1"/>
      <text x="474" y="94" fill="var(--text)" font-size="11" text-anchor="middle">Missed issues</text>

      <rect x="580" y="70" width="164" height="40" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1"/>
      <text x="662" y="94" fill="var(--warn)" font-size="11" text-anchor="middle">More alerts added</text>

      <!-- forward arrows -->
      <line x1="182" y1="90" x2="198" y2="90" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="198,85 198,95 204,90" fill="var(--danger)"/>
      <line x1="370" y1="90" x2="386" y2="90" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="386,85 386,95 392,90" fill="var(--danger)"/>
      <line x1="558" y1="90" x2="574" y2="90" stroke="var(--danger)" stroke-width="1.5"/>
      <polygon points="574,85 574,95 580,90" fill="var(--danger)"/>

      <!-- arrow captions -->
      <text x="192" y="130" fill="var(--text)" font-size="11" text-anchor="middle">tuned out</text>
      <text x="380" y="130" fill="var(--text)" font-size="11" text-anchor="middle">slip by</text>
      <text x="568" y="130" fill="var(--text)" font-size="11" text-anchor="middle">add more</text>

      <!-- return loop -->
      <path d="M662,110 C662,172 588,182 498,182 L198,182 C108,182 98,172 98,114" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <polygon points="93,118 103,118 98,111" fill="var(--danger)"/>
      <text x="380" y="205" fill="var(--danger)" font-size="11" text-anchor="middle">&#8635; and the cycle repeats &#8212; louder every round</text>
    </svg>
  </div>
  <figcaption>Fig. &#8212; Every fix points inward: more alerts to catch what you missed, which is exactly what made you miss things. The loop has to be broken, not tuned.</figcaption>
</figure>

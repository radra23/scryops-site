<!-- layouts/shortcodes/obs-knowledge-tiers.html
     Four tiers, four non-chromatic identities:
       glyph        disc -> triangle -> diamond -> square
       rail value   ramp-4 -> ramp-3 -> ramp-2 -> ramp-1  (calmest -> most severe)
       rail width   1.5 -> 2.5 -> 3.5 -> 4.5px
     Previously Charted/--green and Marked/--warn both resolved to --mc-ramp-2
     under html.pref-mono, and Rumored/--cyan and Here Be Dragons/--danger both
     resolved to --mc-ramp-1 — the four tiers collapsed into two. Ramp steps
     are now referenced directly. -->

<figure class="knt-fig"
  aria-label="Four tiers of monitoring coverage using cartographic naming, each marked with a distinct shape and an increasingly heavy rail rather than a colour. Charted, marked with a circle on the thinnest rail: failure modes you have instrumented and alerted on — explored territory. Marked, marked with a triangle: gaps you know exist but have not yet instrumented — on the map, unexplored. Rumored, marked with a diamond: signals already in your telemetry that nobody has queried — the data exists, the monitoring capability does not. Here Be Dragons, marked with a square on the thickest rail: failure modes that could not have been predicted — off the edge of every map, no alert possible. The fastest wins are in the Rumored tier. The most interesting incidents live at the bottom.">
  <div class="knt-wrap">
    <div class="knt-hdr">WHAT YOUR MONITORING SYSTEM CAN SEE</div>

    <div class="knt-lane" style="border-left-width:1.5px;border-left-color:var(--mc-ramp-4);">
      <svg class="knt-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-4)" aria-hidden="true"><circle cx="7" cy="7" r="6"/></svg>
      <div>
        <div class="knt-lp" style="color:var(--mc-ramp-4);">Charted</div>
        <div class="knt-ls">EXPLORED</div>
      </div>
      <div class="knt-desc">
        <b>Payment success rate, p99 latency, transaction volume</b>
        <small>Failure modes you&rsquo;ve seen before. Alerts written. Dashboards built.</small>
      </div>
      <div class="knt-tag" style="color:var(--mc-ramp-4);border-color:var(--mc-ramp-4);background:color-mix(in srgb, var(--mc-ramp-4) 12%, transparent);">MONITORED<br>&amp; ALERTED</div>
    </div>

    <div class="knt-lane" style="border-left-width:2.5px;border-left-color:var(--mc-ramp-3);">
      <svg class="knt-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-3)" aria-hidden="true"><polygon points="7,1 13.2,12.5 0.8,12.5"/></svg>
      <div>
        <div class="knt-lp" style="color:var(--mc-ramp-3);">Marked</div>
        <div class="knt-ls">ON THE MAP</div>
      </div>
      <div class="knt-desc">
        <b>Regional latency variance, untested load spikes</b>
        <small>You know the instrumentation is missing. It&rsquo;s on the backlog.</small>
      </div>
      <div class="knt-tag" style="color:var(--mc-ramp-3);border-color:var(--mc-ramp-3);background:color-mix(in srgb, var(--mc-ramp-3) 10%, transparent);">KNOWN<br>GAP</div>
    </div>

    <div class="knt-lane" style="border-left-width:3.5px;border-left-color:var(--mc-ramp-2);">
      <svg class="knt-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-2)" aria-hidden="true"><polygon points="7,0.5 13.5,7 7,13.5 0.5,7"/></svg>
      <div>
        <div class="knt-lp" style="color:var(--mc-ramp-2);">Rumored</div>
        <div class="knt-ls">UNQUERIED</div>
      </div>
      <div class="knt-desc">
        <b>Fields logged for months, never filtered on</b>
        <small>The data exists. Nobody has built the alert yet. Fastest wins live here.</small>
      </div>
      <div class="knt-tag" style="color:var(--mc-ramp-2);border-color:var(--mc-ramp-2);background:color-mix(in srgb, var(--mc-ramp-2) 10%, transparent);">DATA<br>EXISTS</div>
    </div>

    <div class="knt-lane" style="border-left-width:4.5px;border-left-color:var(--mc-ramp-1);">
      <svg class="knt-glyph" viewBox="0 0 14 14" fill="var(--mc-ramp-1)" aria-hidden="true"><rect x="1" y="1" width="12" height="12"/></svg>
      <div>
        <div class="knt-lp" style="color:var(--mc-ramp-1);">Here Be Dragons</div>
        <div class="knt-ls">BEYOND THE MAP</div>
      </div>
      <div class="knt-desc">
        <b>Novel cascades, edge-case third-party interactions, emergent failure modes</b>
        <small>No alert could have been written. The failure mode didn&rsquo;t exist yet.</small>
      </div>
      <div class="knt-tag" style="color:var(--mc-ramp-1);border-color:var(--mc-ramp-1);background:color-mix(in srgb, var(--mc-ramp-1) 10%, transparent);">NO ALERT<br>POSSIBLE</div>
    </div>

    <div class="knt-foot">Traditional monitoring covers only the top tier. The fastest wins are in the third. The most interesting incidents live at the <b>bottom</b>.</div>
  </div>
  <figcaption>Fig. &mdash; Four tiers of coverage, from charted territory to the edge of the map. Most teams explore them in reverse order.</figcaption>
</figure>
